name: dentalcare_mobile
description: DentalCare Pro - Enterprise Cross-Platform Mobile Application Suite (Dentist, Receptionist, Patient)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking & Serialization
  dio: ^5.7.0
  json_annotation: ^4.9.0

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Storage & Offline Cache
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3
  path_provider: ^2.1.5

  # Biometrics & Security
  local_auth: ^2.2.0
  crypto: ^3.0.3

  # Media, Camera & Signatures
  camera: ^0.11.0
  image_picker: ^1.1.2
  signature: ^5.4.1

  # Push Notifications & Deep Linking
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  app_links: ^6.3.2

  # UI Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
