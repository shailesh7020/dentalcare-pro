global:
  resolve_timeout: 5m
  slack_api_url: "https://hooks.slack.com/services/DENTALCARE/OPS_ALERTS/PROD_KEY"

route:
  group_by: ["alertname", "cluster", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "slack-notifications"
  routes:
    - match:
        severity: critical
      receiver: "pagerduty-critical"
      continue: true

receivers:
  - name: "slack-notifications"
    slack_configs:
      - channel: "#ops-alerts"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: "{{ .CommonAnnotations.summary }}\n{{ .CommonAnnotations.description }}"

  - name: "pagerduty-critical"
    pagerduty_configs:
      - service_key: "dentalcare-pagerduty-service-key-prod"
        severity: "critical"
