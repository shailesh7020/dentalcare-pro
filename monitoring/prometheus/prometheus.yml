global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "dentalcare-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          tier: "backend"
          service: "fastapi"

  - job_name: "dentalcare-postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          tier: "database"
          service: "postgresql"

  - job_name: "dentalcare-redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          tier: "cache"
          service: "redis"

  - job_name: "kubernetes-nodes"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          tier: "infrastructure"
