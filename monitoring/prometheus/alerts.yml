groups:
  - name: dentalcare-platform-alerts
    rules:
      - alert: DentalCareApiHighLatency
        expr: histogram_quantile(0.95, sum(rate(dentalcare_http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "API P95 latency is exceeding 500ms SLA"
          description: "P95 latency is currently at {{ $value }}s on endpoint cluster."

      - alert: DentalCareApiErrorRateSpike
        expr: sum(rate(dentalcare_http_requests_total{status=~"5.."}[5m])) / sum(rate(dentalcare_http_requests_total[5m])) > 0.01
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx error rate exceeded 1%"
          description: "Current error rate is {{ $value | humanizePercentage }}."

      - alert: DentalCareDatabaseConnectionsExhausted
        expr: dentalcare_db_connections_active > 180
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL active connections approaching maximum limit"
          description: "Active connections are at {{ $value }} (limit is 200)."

      - alert: DentalCareBackgroundQueueLag
        expr: dentalcare_redis_queue_length > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Background worker queues are lagging"
          description: "Queue depth has exceeded 1,000 tasks for > 5 minutes."
