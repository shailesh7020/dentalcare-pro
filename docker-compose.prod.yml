version: "3.9"

services:
  # Ingress Reverse Proxy with WAF & Rate Limiting
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    restart: always

  # Primary Database
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dentalcare
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretProdPass123!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dentalcare"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # Redis HA with AOF & RDB persistence
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-RedisStrongProdAuth99!}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisStrongProdAuth99!}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  # Migration Runner
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-SuperSecretProdPass123!}@db:5432/dentalcare
      SECRET_KEY: ${SECRET_KEY:-prod-secret-key-must-be-at-least-thirty-two-chars-long!}
      JWT_SECRET: ${JWT_SECRET:-prod-jwt-secret-key-must-be-at-least-thirty-two-chars!}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 14
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisStrongProdAuth99!}@redis:6379/0
      CORS_ORIGINS: http://localhost,http://localhost:3000
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # Core API Cluster
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-SuperSecretProdPass123!}@db:5432/dentalcare
      SECRET_KEY: ${SECRET_KEY:-prod-secret-key-must-be-at-least-thirty-two-chars-long!}
      JWT_SECRET: ${JWT_SECRET:-prod-jwt-secret-key-must-be-at-least-thirty-two-chars!}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 14
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisStrongProdAuth99!}@redis:6379/0
      CORS_ORIGINS: http://localhost,http://localhost:3000
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - clinical_storage_prod:/app/storage
    restart: always

  # Background Queue Worker (Notifications, AI processing, Reports)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.task_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-SuperSecretProdPass123!}@db:5432/dentalcare
      SECRET_KEY: ${SECRET_KEY:-prod-secret-key-must-be-at-least-thirty-two-chars-long!}
      JWT_SECRET: ${JWT_SECRET:-prod-jwt-secret-key-must-be-at-least-thirty-two-chars!}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 14
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisStrongProdAuth99!}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # Next.js 16 Web Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
    depends_on:
      - api
    restart: always

volumes:
  postgres_primary_data:
  redis_prod_data:
  clinical_storage_prod:
