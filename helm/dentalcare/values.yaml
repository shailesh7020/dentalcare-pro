global:
  environment: production
  domain: dentalcarepro.com

backend:
  replicaCount: 3
  image:
    repository: dentalcare/backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

worker:
  replicaCount: 2
  image:
    repository: dentalcare/backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 256Mi

web:
  replicaCount: 2
  image:
    repository: dentalcare/web
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    limits:
      cpu: 800m
      memory: 512Mi
    requests:
      cpu: 150m
      memory: 128Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/limit-rps: "50"
  hosts:
    - host: app.dentalcarepro.com
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /metrics
          pathType: Exact
          service: backend
        - path: /
          pathType: Prefix
          service: web
  tls:
    - secretName: dentalcare-tls-cert
      hosts:
        - app.dentalcarepro.com

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

secrets:
  databaseUrl: ""
  redisUrl: ""
  secretKey: ""
  jwtSecret: ""

storage:
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 20Gi
    storageClass: ""
