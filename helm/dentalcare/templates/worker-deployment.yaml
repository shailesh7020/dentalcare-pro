apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dentalcare.fullname" . }}-worker
  labels:
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          command: ["python", "-m", "app.workers.task_worker"]
          envFrom:
            - configMapRef:
                name: {{ include "dentalcare.fullname" . }}-config
            - secretRef:
                name: {{ include "dentalcare.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
