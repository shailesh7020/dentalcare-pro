apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dentalcare.fullname" . }}-config
data:
  ENVIRONMENT: "production"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "14"
  STORAGE_BACKEND: "s3"
  CORS_ORIGINS: "https://{{ (index .Values.ingress.hosts 0).host }}"
