# =====================================================================
# DentalCare Pro - Enterprise PostgreSQL 17 Production Configuration
# Tuned for high-concurrency, low-latency multi-tenant healthcare SaaS
# =====================================================================

# -----------------------------
# Connectivity & Networking
# -----------------------------
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 5
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 10

# -----------------------------
# Memory Allocation
# -----------------------------
# Assuming dedicated DB node with 16GB RAM
shared_buffers = 4GB
work_mem = 64MB
maintenance_work_mem = 512MB
effective_cache_size = 12GB
temp_buffers = 16MB

# -----------------------------
# Worker Processes & Parallelism
# -----------------------------
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# -----------------------------
# Write Ahead Log (WAL) & High Availability
# -----------------------------
wal_level = replica
synchronous_commit = on
wal_sync_method = fdatasync
wal_buffers = 64MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 16GB
min_wal_size = 1GB

# WAL Archiving for Continuous PITR
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 60

# Streaming Replication
max_wal_senders = 10
wal_keep_size = 4096MB
hot_standby = on
hot_standby_feedback = on

# -----------------------------
# Query Tuning & Planner
# -----------------------------
random_page_cost = 1.1                  # Fast NVMe/SSD storage
effective_io_concurrency = 200          # Concurrent SSD I/O channels
default_statistics_target = 100
cursor_tuple_fraction = 0.1

# -----------------------------
# Logging & Auditing (HIPAA Compliant)
# -----------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0600
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250        # Log slow queries > 250ms
log_line_prefix = '%m [%p] %q%u@%d app=%a '
log_lock_waits = on
log_checkpoints = on
log_connections = on
log_disconnections = on
log_statement = 'ddl'                   # Audit all schema changes
log_temp_files = 0                      # Log all temp files to monitor work_mem usage

# -----------------------------
# Autovacuum Engine Tuning
# -----------------------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000
autovacuum_vacuum_cost_delay = 2ms

# -----------------------------
# Client Connection & Security
# -----------------------------
ssl = on
ssl_ciphers = 'HIGH:!aNULL:!MD5'
password_encryption = scram-sha-256
statement_timeout = 60000               # Terminate statements exceeding 60s
lock_timeout = 10000                    # Abort locks waiting longer than 10s
idle_in_transaction_session_timeout = 30000 # 30s max idle in transaction
