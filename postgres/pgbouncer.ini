; =====================================================================
; DentalCare Pro - PgBouncer Connection Pooler Configuration
; Transaction-level pooling for backend API and worker pods
; =====================================================================

[databases]
dentalcare = host=127.0.0.1 port=5432 dbname=dentalcare auth_user=postgres
dentalcare_replica = host=127.0.0.1 port=5433 dbname=dentalcare auth_user=postgres

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
listen_addr = *
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = prometheus_exporter

; Pool Configuration
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 5.0
max_db_connections = 180

; Timeouts & Connection Health
server_idle_timeout = 600.0
server_connect_timeout = 15.0
server_login_retry = 1.0
client_idle_timeout = 0.0
client_login_timeout = 15.0
query_timeout = 120.0
query_wait_timeout = 30.0

; TCP Keepalive
pkt_buf = 4096
listen_backlog = 200
tcp_keepalive = 1
tcp_keepcnt = 5
tcp_keepidle = 30
tcp_keepintvl = 10
