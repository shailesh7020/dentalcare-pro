<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DentalCare Pro - Starting...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      border: 1px solid #1e293b;
      user-select: none;
      -webkit-app-region: drag;
    }
    .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #0f766e, #2dd4bf, #0284c7);
    }
    .logo-box {
      width: 72px; height: 72px;
      background: #0f766e;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(15, 118, 110, 0.5);
      margin-bottom: 18px;
    }
    .logo-cross {
      position: relative;
      width: 36px; height: 36px;
    }
    .logo-cross::before, .logo-cross::after {
      content: "";
      position: absolute;
      background: #ffffff;
      border-radius: 4px;
    }
    .logo-cross::before {
      top: 13px; left: 0; width: 36px; height: 10px;
    }
    .logo-cross::after {
      top: 0; left: 13px; width: 10px; height: 36px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 4px;
    }
    h1 span { color: #2dd4bf; }
    p.subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .progress-container {
      width: 320px;
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-bar {
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, #0f766e, #2dd4bf);
      border-radius: 3px;
      animation: indeterminate 2s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% { margin-left: -35%; width: 35%; }
      50% { width: 50%; }
      100% { margin-left: 100%; width: 35%; }
    }
    p.status-text {
      font-size: 11px;
      color: #2dd4bf;
      font-weight: 500;
    }
    .footer {
      position: absolute;
      bottom: 12px;
      font-size: 9px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="logo-box">
    <div class="logo-cross"></div>
  </div>
  <h1>DentalCare <span>Pro</span></h1>
  <p class="subtitle">Enterprise Dental Practice Management Platform (v1.0.0)</p>

  <div class="progress-container">
    <div class="progress-bar"></div>
  </div>
  <p class="status-text" id="statusMessage">Starting background services & verifying database...</p>

  <div class="footer">
    Protected by HIPAA Security Rule &amp; GDPR Technical Safeguards
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('boot-status', (event, message) => {
      const el = document.getElementById('statusMessage');
      if (el) el.innerText = message;
    });
  </script>
</body>
</html>
