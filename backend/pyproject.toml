[project]
name = "dentalcare-pro-api"
version = "1.0.0"
description = "DentalCare Pro clinic management API"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.34,<1.0", "sqlalchemy>=2.0,<3.0",
  "asyncpg>=0.30,<1.0", "psycopg[binary]>=3.2,<4.0", "alembic>=1.14,<2.0", "pydantic-settings>=2.7,<3.0",
  "pyjwt>=2.10,<3.0", "bcrypt>=4.2,<5.0", "python-multipart>=0.0.20,<1.0",
  "redis>=5.2,<6.0", "celery>=5.4,<6.0", "email-validator>=2.2,<3.0",
  "reportlab>=5.0,<6.0"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "httpx>=0.28", "pytest-cov>=6.0", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::UserWarning:pydantic._internal._fields",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["B008", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ005", "DTZ007", "RUF059", "S110", "BLE001", "S101"]
